name: Update README stats

on:
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * *"
  push:
    paths:
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate stats default
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Ahmedefti21&show_icons=true&rank_icon=github&theme=default&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate stats tokyonight
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Ahmedefti21&show_icons=true&rank_icon=github&theme=tokyonight&hide_border=true
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top-langs default
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Ahmedefti21&layout=compact&langs_count=8&theme=default&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top-langs tokyonight
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Ahmedefti21&layout=compact&langs_count=8&theme=tokyonight&hide_border=true
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/stats-dark.svg profile/top-langs.svg profile/top-langs-dark.svg
          if git diff --cached --quiet; then
            echo "Cards are already up to date."
            exit 0
          fi
          git commit -m "Update profile stats cards"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
